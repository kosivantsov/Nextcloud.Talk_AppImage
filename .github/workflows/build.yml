name: Build Nextcloud Talk AppImage

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 06:00 UTC
  workflow_dispatch:    # Allows manual triggering from the Actions tab

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5 

      - name: Get latest upstream version
        id: upstream
        run: |
          VERSION=$(curl -s https://api.github.com/repos/nextcloud/talk-desktop/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Download and extract official zip
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          ZIP_URL="https://github.com/nextcloud/talk-desktop/releases/download/${VERSION}/Nextcloud.Talk-linux-x64.zip"
          
          # Try official repo first, fallback to nextcloud-releases org if needed
          wget -q "$ZIP_URL" -O talk.zip || \
          wget -q "https://github.com/nextcloud-releases/talk-desktop/releases/download/${VERSION}/Nextcloud.Talk-linux-x64.zip" -O talk.zip
          
          mkdir -p AppDir
          mkdir -p temp_extract
          unzip -q talk.zip -d temp_extract
          
          # Find the dynamically named extracted folder and move contents to AppDir
          EXTRACTED_DIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
          
          if [ -n "$EXTRACTED_DIR" ]; then
            mv "$EXTRACTED_DIR"/* AppDir/
            mv "$EXTRACTED_DIR"/.* AppDir/ 2>/dev/null || true
          else
            mv temp_extract/* AppDir/
          fi
          
          rm -rf temp_extract talk.zip

      - name: Create AppRun launcher
        run: |
          # Ensure the main executable has execution rights
          chmod +x "AppDir/Nextcloud Talk"
          
          # Create the AppRun wrapper
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          exec "$HERE/Nextcloud Talk" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Create Desktop file
        run: |
          cat > AppDir/nextcloud-talk.desktop << 'EOF'
          [Desktop Entry]
          Name=Nextcloud Talk
          Exec=AppRun %U
          Terminal=false
          Type=Application
          Icon=nextcloud-talk
          StartupWMClass=Nextcloud Talk
          Categories=Network;InstantMessaging;
          Comment=Nextcloud Talk Desktop Client
          EOF

      - name: Download application icon
        run: |
          ICON_URL="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nextcloud-talk.png"
          wget -q "$ICON_URL" -O AppDir/nextcloud-talk.png || \
          wget -q "https://raw.githubusercontent.com/nextcloud/talk-desktop/main/build/icon.png" -O AppDir/nextcloud-talk.png

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          
          # Use APPIMAGE_EXTRACT_AND_RUN to safely run AppImages in CI without FUSE
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          
          ./appimagetool AppDir "Nextcloud-Talk-${VERSION}-x86_64.AppImage"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.upstream.outputs.version }}
          name: Nextcloud Talk ${{ steps.upstream.outputs.version }}
          files: "*.AppImage"
          token: ${{ secrets.GITHUB_TOKEN }}
