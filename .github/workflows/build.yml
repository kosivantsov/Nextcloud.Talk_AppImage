name: Build Nextcloud Talk AppImage

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 06:00 UTC
  workflow_dispatch:    # Allows manual triggering from the Actions tab

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # Required to publish GitHub Releases

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get latest upstream version
        id: upstream
        run: |
          # Fetch latest release tag from the official repo
          VERSION=$(curl -s https://api.github.com/repos/nextcloud/talk-desktop/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Download and extract official zip
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          ZIP_URL="https://github.com/nextcloud/talk-desktop/releases/download/${VERSION}/Nextcloud.Talk-linux-x64.zip"
          
          wget -q "$ZIP_URL" -O talk.zip
          unzip -q talk.zip
          
          # The zip extracts to a folder named "Nextcloud Talk-linux-x64"
          # Rename it to AppDir for standard AppImage packaging
          mv "Nextcloud Talk-linux-x64" AppDir

      - name: Create AppRun launcher
        run: |
          # Create an AppRun script to handle the executable with a space in its name
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          exec "$HERE/Nextcloud Talk" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Create Desktop file
        run: |
          cat > AppDir/nextcloud-talk.desktop << 'EOF'
          [Desktop Entry]
          Name=Nextcloud Talk
          Exec=AppRun %U
          Terminal=false
          Type=Application
          Icon=nextcloud-talk
          StartupWMClass=Nextcloud Talk
          Categories=Network;InstantMessaging;
          Comment=Nextcloud Talk Desktop Client
          EOF

      - name: Download application icon
        run: |
          # Fetch the official icon from the Nextcloud Talk Desktop repo
          ICON_URL="https://raw.githubusercontent.com/nextcloud/talk-desktop/main/build/icons/512x512.png"
          wget -q "$ICON_URL" -O AppDir/nextcloud-talk.png || \
          wget -q "https://raw.githubusercontent.com/nextcloud/talk-desktop/main/build/icon.png" -O AppDir/nextcloud-talk.png

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          # Extract the AppImage tool (to avoid FUSE issues in CI environments)
          ./appimagetool --appimage-extract
          
          # Build the final AppImage using the extracted tool
          ARCH=x86_64 VERSION="$VERSION" ./squashfs-root/AppRun AppDir "Nextcloud-Talk-${VERSION}-x86_64.AppImage"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.version }}
          name: Nextcloud Talk ${{ steps.upstream.outputs.version }}
          files: "*.AppImage"
          token: ${{ secrets.GITHUB_TOKEN }}
